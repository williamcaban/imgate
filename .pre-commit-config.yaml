# Install once per clone:  uvx pre-commit@4.7.0 install
# Run by hand:             uvx pre-commit@4.7.0 run --all-files
# Offline or OSV unreachable: SKIP=uv-audit git commit ...   (CI still audits)
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-audit
        name: known vulnerabilities in locked dependencies (uv audit, OSV)
        # Runs on every commit, not only when uv.lock changes: advisories are published after a lock is written.
        entry: uv audit --locked --preview-features audit-command
        language: system
        always_run: true
        pass_filenames: false
